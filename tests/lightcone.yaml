# E2E hook-dispatch test spec for the lightcone plugin. Field-by-field
# documentation of how specs work lives in tests/astra.yaml.
#
# lightcone ships ONE hook of its own (the engine preflight) and VENDORS the
# astra plugin (via `dependencies` in skills.config.json), so byte-copies of
# astra's hooks are packaged alongside it under plugins/lightcone/hooks/.
# These tests install `lightcone` ALONE and exercise both: the astra dispatch
# checks against the vendored copy prove the bundling path (closure copy,
# hooks.json merge, script flattening, pin substitution) produces a plugin
# whose hooks actually fire; the preflight check proves lightcone's own
# SessionStart entry survives that same merge. The runner gives each spec a
# fresh config home, so this evidence cannot come from a standalone astra
# install.
#
# The `astra-tools@x.y.z` placeholder below resolves through lightcone's
# EFFECTIVE pins — inherited from the bundled astra dependency.

plugin: lightcone

# Same minimal VALID fixture as tests/astra.yaml (the vendored hooks run the
# real pinned toolchain against it).
project:
  astra.yaml: |
    version: "0.0.13"
    name: "E2E fixture"
    description: "Minimal valid analysis used as the e2e project fixture."

    inputs:
      - id: primary_data
        type: data
        description: "Placeholder input."

    outputs:
      - id: main_result
        type: metric
        description: "Placeholder output."
        inputs: [primary_data]
        recipe:
          command: python analyze.py --data {inputs.primary_data} --out {output}

# Warm the pinned environment so the first hook invocation isn't racing its
# timeout against a cold download.
setup:
  - uvx astra-tools@x.y.z --help

tests:
  - name: session-start-primer
    event: SessionStart
    prompt: "Reply with exactly: OK"
    expect_context: E2E fixture
    forbid_context:
      - Could not run                # `astra info` failed
      # Scoped to uv on purpose: lightcone's own SessionStart hook injects
      # into this same trace, and "The Lightcone engine is not installed" is
      # its CORRECT output on a runner that has no `lc`. A bare "is not
      # installed" marker would fail on it.
      # (uv missing on the runner)
      - "`uv` is not installed"

  - name: validate-on-save
    event: PostToolUse
    prompt: >-
      A file named astra.yaml exists in the current directory. Append the
      comment line `# e2e-touch` to the end of astra.yaml using your file
      editing tool. Do nothing else, and do not explain.
    edits_file: astra.yaml
    attempts: 3
    expect_context: ASTRA validation passed
    forbid_context:
      - validation FAILED   # spec rejected
      - not validated       # uv missing, or the toolchain crashed

  # lightcone's own SessionStart hook, merged alongside astra's. The engine
  # state it reports is host-dependent (absent / too old / ready), so assert
  # only on the framing every branch emits, and forbid the shapes that mean
  # something went wrong.
  - name: engine-preflight
    event: SessionStart
    prompt: "Reply with exactly: OK"
    expect_context: Lightcone project
    forbid_context:
      - did not report a version  # `lc` on PATH but broken or not the engine
    # Which remedy the hook names — ask a person, or act because none is
    # there — is deliberately NOT asserted here. These are real headless
    # sessions, so the Claude leg's own harness sets
    # CLAUDE_CODE_ENTRYPOINT=sdk-cli for its hook children (the runner cannot
    # override what the harness exports to its own children), and the hook
    # correctly reports the autonomous remedy; Codex exports no such variable
    # and correctly gets the interactive one. Asserting either way would fail
    # one leg. Mode selection is covered offline in scripts/test-hooks.mjs,
    # where the environment is controlled exactly.
