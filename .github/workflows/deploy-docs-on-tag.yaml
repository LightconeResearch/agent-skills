name: Deploy versioned docs on tag

on:  # yamllint disable-line rule:truthy
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (without leading v), e.g. 0.0.2"
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pyversion: ["3.13"]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: true

      - name: Configure git for the bot
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Resolve version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Deploy versioned docs to gh-pages
        run: >-
          uvx --from git+https://github.com/squidfunk/mike.git
          --with zensical
          mike deploy --push --update-aliases
          "${{ steps.version.outputs.version }}" latest
