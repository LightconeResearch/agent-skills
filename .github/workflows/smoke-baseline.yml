# Publish the smoke baseline: when a smoke run on a push to main finishes, its
# summary.json (which carries the rolling pool, see evals/bin/report.py)
# becomes baseline.json on the orphan branch smoke-baseline, readable without
# a token at raw.githubusercontent.com/LightconeResearch/agent-skills/smoke-baseline/baseline.json.
# Only runs whose report gate passed are published. This lives apart from
# smoke.yml so that workflow never needs contents: write, and lightcone-cli
# can call it without granting that.
name: smoke-baseline

on:
  workflow_run:
    workflows: [smoke]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: smoke-baseline
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the run's summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n smoke-summary -D summary
      - name: Publish baseline.json to smoke-baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(jq -r .gate summary/summary.json)" != pass ]; then
            echo "::notice::run $RUN_ID did not pass its gate; the baseline stays as it was"
            exit 0
          fi
          jq --arg sha "$SHA" --arg run "$RUN_ID" '. + {commit: $sha, run: $run}' summary/summary.json > baseline.json
          git init -q pub && cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin smoke-baseline; then
            git checkout -q -b smoke-baseline FETCH_HEAD
          else
            git checkout -q --orphan smoke-baseline
          fi
          cp ../baseline.json baseline.json
          git add baseline.json
          git commit -qm "smoke baseline from main@${SHA:0:7} (run $RUN_ID)"
          git push -q origin smoke-baseline
