# Plugin smoke suite (evals/): can a model, given the lightcone plugin, still
# get through five core tasks, and what got in its way? See evals/README.md.
#
# Every PR (and the nightly latest leg) runs ONE leg: Claude Code with
# claude-sonnet-5-5 and the whole plugin, K=1, all five tasks (DEFAULT_LEGS).
# The ablation legs (haiku plugin / skill, codex luna skill; ALL_LEGS) are for
# workflow_dispatch with `legs: all` or names.
#
#   oracle  reference solutions against the stack under test, no LLM, no secrets
#           (runs on fork PRs too), plus the astra-tools skew/override check
#   legs    the planned legs, one runner each
#   report  per (leg, task) against the baseline; the judge reads every trial of
#           the default leg (failures and outliers only on bigger runs); one
#           sticky PR comment that says why each failure failed (verifier output,
#           judge summary, last message), and a full HTML report per run
#
# Gate (evals/bin/report.py): the oracle fails; a cell passing >= 80% on main
# (pooled over the last 5 pushes) goes 0/K; or a leg's passes are improbably
# low against its cells' pooled rates (Poisson-binomial tail < 0.01). Other
# failures in solid cells warn; with no baseline yet, any 0/K cell blocks.
# Runs on main record the baseline and gate only on the oracle.
#
# Secrets: ANTHROPIC_API_KEY (claude-code legs and the judge), OPENAI_API_KEY
# (codex leg). API keys only; never a subscription OAuth token. A missing key
# FAILS its leg (a forgotten key must not silently green the check), so PRs
# from forks fail the legs: GitHub never exposes secrets to forks.
#
# lightcone-cli PRs reuse this through workflow_call with their head sha:
#   uses: LightconeResearch/agent-skills/.github/workflows/smoke.yml@main
#   with: { lightcone_ref: "${{ github.event.pull_request.head.sha }}" }
#   secrets: inherit
# (the caller grants contents: read, pull-requests: write). Their runs get the
# comment and the artifact; the hosted report is for this repo's own runs.
#
# Publishing: .github/workflows/smoke-publish.yml, after each run here, puts
# report.html on gh-pages at smoke/<run id>/ and, for passing pushes to main,
# summary.json on the orphan branch smoke-baseline as baseline.json, which
# every run reads from raw.githubusercontent.com with no token.
name: smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - skills/**
      - hooks/**
      - plugins/**
      - skills.config.json
      - evals/**
      - .github/workflows/smoke.yml
  push:
    branches: [main]
    paths:
      - skills/**
      - hooks/**
      - plugins/**
      - skills.config.json
      - evals/**
      - .github/workflows/smoke.yml
  schedule:
    - cron: "23 3 * * *"   # the latest leg: astra-tools and lightcone-cli from main
  workflow_dispatch:
    inputs:
      astra_ref:
        description: "astra-tools git ref (empty: the plugin's pin from PyPI)"
        default: ""
      lightcone_ref:
        description: "lightcone-cli git ref (empty: the plugin's pin from PyPI)"
        default: ""
      k:
        description: "Attempts per task"
        default: "1"
      legs:
        description: "default (Sonnet 5.5 + plugin), all, or leg names (claude-sonnet-plugin claude-haiku-plugin claude-haiku-skill codex-luna-skill)"
        default: default
  workflow_call:
    inputs:
      lightcone_ref:
        description: "lightcone-cli git ref or sha under test"
        type: string
        required: true
      astra_ref:
        description: "astra-tools git ref (empty: the plugin's pin)"
        type: string
        default: ""
      tasks:
        description: "Space-separated globs over the evals/smoke task dir names"
        type: string
        default: "*"
      k:
        description: "Attempts per task"
        type: number
        default: 1
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: agent-skills-smoke-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HARBOR_VERSION: 0.22.0
  # The leg set: what every PR runs, and everything a dispatch can ask for.
  DEFAULT_LEGS: claude-code:claude-sonnet-5-5:plugin
  ALL_LEGS: >-
    claude-code:claude-sonnet-5-5:plugin
    claude-code:claude-haiku-4-5:plugin
    claude-code:claude-haiku-4-5:skill
    codex:gpt-6-luna:skill
  JUDGE_MODEL: claude-sonnet-5-5
  K: ${{ inputs.k || 1 }}
  TASKS: ${{ inputs.tasks || '*' }}
  # On a workflow_call the caller's repo is github.repository; the suite always
  # comes from agent-skills (at the run's own commit when it runs here). The
  # oracle job resolves this once to a sha that the other jobs check out.
  SKILLS_REPO: LightconeResearch/agent-skills
  SKILLS_REF: ${{ github.repository == 'LightconeResearch/agent-skills' && github.sha || 'main' }}

jobs:
  oracle:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      tasks: ${{ steps.plan.outputs.tasks }}
      astra_tools: ${{ steps.stack.outputs.ASTRA_TOOLS }}
      astra_pin: ${{ steps.stack.outputs.ASTRA_PIN }}
      lightcone_cli: ${{ steps.stack.outputs.LIGHTCONE_CLI }}
      suite_sha: ${{ steps.suite.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ env.SKILLS_REF }}
      - name: Pin the suite revision (legs and report check out this exact commit)
        id: suite
        run: echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
      - name: Resolve the stack under test
        id: stack
        env:
          ASTRA_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.astra_ref }}
          LIGHTCONE_REF: ${{ github.event_name == 'schedule' && 'main' || inputs.lightcone_ref }}
        run: evals/bin/stack.sh | tee -a "$GITHUB_OUTPUT" "$GITHUB_ENV"
      - name: Plan the legs
        id: plan
        env:
          LEGS: ${{ inputs.legs || 'default' }}
        run: |
          legs=()
          for spec in $ALL_LEGS; do
            name="$(evals/bin/smoke.sh --name "$spec")"
            if [ "$LEGS" = default ]; then [[ " $DEFAULT_LEGS " == *" $spec "* ]] || continue
            elif [ "$LEGS" != all ]; then [[ " $LEGS " == *" $name "* ]] || continue; fi
            key=ANTHROPIC_API_KEY; [ "${spec%%:*}" = codex ] && key=OPENAI_API_KEY
            legs+=("{\"name\":\"$name\",\"spec\":\"$spec\",\"key\":\"$key\"}")
          done
          [ ${#legs[@]} -gt 0 ] || { echo "::error::no leg matches '$LEGS'"; exit 1; }
          echo "legs=[$(IFS=,; echo "${legs[*]}")]" | tee -a "$GITHUB_OUTPUT"
          # The task dirs TASKS selects: every one must get an oracle run and K trials per leg.
          read -ra globs <<<"$TASKS"
          tasks=()
          for dir in evals/smoke/*/; do
            name="$(basename "$dir")"
            [ -f "$dir/task.toml" ] || continue
            for glob in "${globs[@]}"; do
              # shellcheck disable=SC2254  # the glob is meant to match
              case "$name" in $glob) tasks+=("$name"); break ;; esac
            done
          done
          [ ${#tasks[@]} -gt 0 ] || { echo "::error::no task matches '$TASKS'"; exit 1; }
          echo "tasks=${tasks[*]}" | tee -a "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install "harbor==${HARBOR_VERSION}"
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false   # Harbor builds the task images with the docker-driver default builder
      - name: Build lightcone-eval-base and lightcone-smoke-stack
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: evals/images
          files: docker-bake.hcl
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          set: |
            eval-base.cache-from=type=gha,scope=eval-base
            eval-base.cache-to=type=gha,scope=eval-base,mode=max
            smoke-stack.cache-from=type=gha,scope=smoke-stack
            smoke-stack.cache-to=type=gha,scope=smoke-stack,mode=max
      - name: Version-skew check
        id: skew
        continue-on-error: true
        run: mkdir -p evals/jobs && evals/bin/stack-info.sh > evals/jobs/stack.json
      - name: Gate logic tests
        run: uv run --with pytest pytest evals/tests -q
      - name: Oracle (reference solutions must all score 1.0)
        run: |
          K=1 N=5 evals/bin/smoke.sh oracle
          python3 evals/bin/report.py render evals/jobs --expect-tasks "${{ steps.plan.outputs.tasks }}" --out oracle-report
      - name: Redact API keys
        if: always()
        run: python3 evals/bin/redact.py evals/jobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-leg-oracle
          path: evals/jobs/
          retention-days: 30
      - name: Fail on version skew
        if: steps.skew.outcome == 'failure'
        run: |
          echo "::error::astra-tools skew or override against lightcone-cli's requirement (see the 'Version-skew check' step)"
          exit 1

  legs:
    needs: oracle
    name: ${{ matrix.leg.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.oracle.outputs.legs) }}
    env:
      ASTRA_TOOLS: ${{ needs.oracle.outputs.astra_tools }}
      ASTRA_PIN: ${{ needs.oracle.outputs.astra_pin }}
      LIGHTCONE_CLI: ${{ needs.oracle.outputs.lightcone_cli }}
    steps:
      - name: Require the leg's API key
        env:
          LEG_KEY: ${{ secrets[matrix.leg.key] }}
        run: |
          if [ -z "$LEG_KEY" ]; then
            # The report reads this to show the leg as "not run" with its reason.
            mkdir -p evals/jobs
            echo "${{ matrix.leg.key }} not set (or this is a fork PR)" > "evals/jobs/${{ matrix.leg.name }}.status"
            echo "::error::${{ matrix.leg.name }} needs the ${{ matrix.leg.key }} repository secret, which is not set (or this is a fork PR)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ needs.oracle.outputs.suite_sha || env.SKILLS_REF }}
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install "harbor==${HARBOR_VERSION}"
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false
      - name: Build lightcone-eval-base and lightcone-smoke-stack (from the oracle's cache)
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: evals/images
          files: docker-bake.hcl
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          set: |
            eval-base.cache-from=type=gha,scope=eval-base
            smoke-stack.cache-from=type=gha,scope=smoke-stack
      - name: Run ${{ matrix.leg.spec }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_FORCE_AUTH_JSON: "0"
        run: N=5 evals/bin/smoke.sh "${{ matrix.leg.spec }}"
      - name: Redact API keys (trajectories record whatever the agent printed)
        if: always() && hashFiles('evals/bin/redact.py') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 evals/bin/redact.py evals/jobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-leg-${{ matrix.leg.name }}
          path: evals/jobs/
          retention-days: 30

  report:
    needs: [oracle, legs]
    if: always() && needs.oracle.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ needs.oracle.outputs.suite_sha || env.SKILLS_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-leg-*
          path: evals/jobs
          merge-multiple: true
      - name: Fetch the baseline (published by smoke-publish.yml from main)
        id: baseline
        run: |
          # Public and unauthenticated, so lightcone-cli callers read the same baseline.
          mkdir -p baseline
          url="https://raw.githubusercontent.com/$SKILLS_REPO/smoke-baseline/baseline.json"
          code="$(curl -sS -L -o baseline/baseline.json -w '%{http_code}' "$url" || echo 000)"
          case "$code" in
            200)
              echo "path=baseline/baseline.json" >> "$GITHUB_OUTPUT"
              sha="$(jq -r '.commit // ""' baseline/baseline.json)"
              echo "label=main@${sha:0:7}" >> "$GITHUB_OUTPUT"
              echo "run=$(jq -r '.run // ""' baseline/baseline.json)" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::notice::no baseline yet: every 0/K cell blocks" ;;
            *)
              echo "::warning::could not fetch the baseline ($url: HTTP $code); gating as if there were none"
              echo "error=Baseline fetch failed (HTTP $code), so this run gates as if there were no baseline." >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install "harbor==${HARBOR_VERSION}"
      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          use: false
      - name: Load lightcone-eval-base for the judge (from the oracle's cache)
        # judge.sh runs the judge on it, so Harbor does not apt-get + npm install Claude Code per trial.
        uses: docker/bake-action@v6
        with:
          source: .
          workdir: evals/images
          files: docker-bake.hcl
          targets: eval-base
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          set: eval-base.cache-from=type=gha,scope=eval-base
      - name: Judge the trials
        id: judge
        continue-on-error: true
        timeout-minutes: 12   # the report, comment and gate below still run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASELINE: ${{ steps.baseline.outputs.path }}
          ALL: ${{ (inputs.legs || 'default') == 'default' && '--all' || '' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::judge skipped: no ANTHROPIC_API_KEY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The default leg is five trials: judge them all. Bigger dispatch runs judge failures and outliers.
          # shellcheck disable=SC2086  # ALL is a flag or empty
          python3 evals/bin/report.py select evals/jobs ${BASELINE:+--baseline "$BASELINE"} $ALL > judge-these.txt
          cat judge-these.txt
          [ -s judge-these.txt ] || { echo "nothing to judge"; exit 0; }
          evals/bin/judge.sh < judge-these.txt
      - name: Redact API keys before anything is rendered or uploaded
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 evals/bin/redact.py evals/jobs
      - name: Report
        id: report
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outputs.path }}
          BASE_LABEL: ${{ steps.baseline.outputs.label && format('{0}, run {1}', steps.baseline.outputs.label, steps.baseline.outputs.run) || '' }}
          BASELINE_ERROR: ${{ steps.baseline.outputs.error }}
          RECORD: ${{ github.event_name == 'push' && '--record' || '' }}
          JUDGE_SKIPPED: ${{ steps.judge.outputs.skipped }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          # Every planned leg appears in the comment, including those that never ran.
          EXPECT_LEGS: ${{ join(fromJSON(needs.oracle.outputs.legs || '[]').*.name, ' ') }}
          EXPECT_TASKS: ${{ needs.oracle.outputs.tasks }}
          NOT_RUN_REASON: ${{ needs.oracle.result != 'success' && 'oracle failed' || '' }}
          ORACLE_RESULT: ${{ needs.oracle.result }}
          LEGS_RESULT: ${{ needs.legs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # smoke-publish.yml puts report.html here after the run (this repo's own, non-fork runs only).
          REPORT_URL: >-
            ${{ github.repository == 'LightconeResearch/agent-skills'
            && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
            && format('https://lightconeresearch.github.io/agent-skills/smoke/{0}/', github.run_id) || '' }}
        run: |
          set +e
          note=""
          if [ "$JUDGE_SKIPPED" = true ]; then note="Judge skipped: no ANTHROPIC_API_KEY."
          elif [ "$JUDGE_OUTCOME" = failure ]; then
            note="**The judge did not run to completion**; failures above carry no judge notes. See the run log."
          fi
          # shellcheck disable=SC2086  # RECORD is a flag or empty
          python3 evals/bin/report.py render evals/jobs ${BASELINE:+--baseline "$BASELINE"} \
            --judge evals/jobs/judge --stack evals/jobs/stack.json --run-url "$RUN_URL" --report-url "$REPORT_URL" \
            --base-label "$BASE_LABEL" --judge-note "$note" --expect-legs "$EXPECT_LEGS" \
            --not-run-reason "$NOT_RUN_REASON" --job "oracle=$ORACLE_RESULT" --job "legs=$LEGS_RESULT" \
            --expect-tasks "$EXPECT_TASKS" --k "$K" --baseline-error "$BASELINE_ERROR" \
            --out smoke-report $RECORD
          echo "gate=$?" >> "$GITHUB_OUTPUT"
          [ -f evals/jobs/judge/analysis.json ] && cp evals/jobs/judge/analysis.json smoke-report/judge-analysis.json
          cat smoke-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-summary
          path: smoke-report/
          retention-days: 90
      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # a fork PR's token cannot comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                  --jq '.[] | select(.body | contains("<!-- lightcone-smoke-report -->")) | .id' | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@smoke-report/comment.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@smoke-report/comment.md >/dev/null
          fi
      - name: Gate
        if: always()
        env:
          GATE: ${{ steps.report.outputs.gate }}
        run: '[ "$GATE" = 0 ]'
