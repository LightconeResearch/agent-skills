name: Pin freshness

# Weekly drift check: compare every tool pin declared in skills.config.json
# (each plugin's `tools` map) against the latest release on PyPI and open (or
# update) a single tracking issue when one is behind. Pins stay exact — this
# workflow only surfaces drift, it never edits them. astra-spec is not pinned;
# it resolves from whatever the pinned astra-tools release declares.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pins against PyPI
        id: check
        run: |
          set -euo pipefail

          version_lt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]
          }

          drift=""
          while read -r name pin; do
            latest=$(curl -fsSL "https://pypi.org/pypi/$name/json" | jq -r '.info.version')
            echo "$name: pinned $pin, latest $latest"
            if version_lt "$pin" "$latest"; then
              drift+="- \`$name\`: pinned **$pin**, latest on PyPI **$latest**"$'\n'
            fi
          done < <(node -e 'const c = require("./skills.config.json"); const seen = new Set(); for (const p of c.plugins || []) for (const [k, v] of Object.entries(p.tools || {})) { if (k.startsWith("$") || seen.has(k + "@" + v)) continue; seen.add(k + "@" + v); console.log(k, v); }')

          {
            echo "drift<<EOF"
            printf '%s' "$drift"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.check.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          set -euo pipefail
          TITLE="Toolchain pins are behind PyPI"
          BODY=$(cat <<EOF
          One or more tool pins in \`skills.config.json\` (per-plugin \`tools\` maps) are behind the latest PyPI release:

          $DRIFT
          Pins stay exact. Bump them deliberately after checking the release notes; do not treat this as an auto-merge signal.

          _Opened automatically by the \`Pin freshness\` workflow._
          EOF
          )

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened new issue."
          fi
