name: Pin freshness

# Weekly drift check: compare the exact astra-tools pin in
# hooks/astra/scripts/astra-pins.sh against the latest release on PyPI and open
# (or update) a single tracking issue when it is behind. The pin stays exact —
# this workflow only surfaces drift, it never edits it. astra-spec is not
# pinned; it resolves from whatever the pinned tools release declares.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pins against PyPI
        id: check
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source hooks/astra/scripts/astra-pins.sh

          version_lt() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]
          }

          latest_on_pypi() {
            curl -fsSL "https://pypi.org/pypi/$1/json" | jq -r '.info.version'
          }

          drift=""
          check_one() {
            local name="$1" pin="$2"
            # A pin containing "+" is a git requirement, not a PyPI version — skip.
            if [[ "$pin" == *+* ]]; then
              echo "$name pinned to a git requirement ($pin) — skipping PyPI check."
              return
            fi
            local latest
            latest=$(latest_on_pypi "$name")
            echo "$name: pinned $pin, latest $latest"
            if version_lt "$pin" "$latest"; then
              drift+="- \`$name\`: pinned **$pin**, latest on PyPI **$latest**"$'\n'
            fi
          }

          check_one astra-tools "$ASTRA_TOOLS_PIN"

          {
            echo "drift<<EOF"
            printf '%s' "$drift"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        if: steps.check.outputs.drift != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          set -euo pipefail
          TITLE="Toolchain pins are behind PyPI"
          BODY=$(cat <<EOF
          One or more toolchain pins in \`hooks/astra/scripts/astra-pins.sh\` are behind the latest PyPI release:

          $DRIFT
          Pins stay exact. Bump them deliberately after checking the release notes; do not treat this as an auto-merge signal.

          _Opened automatically by the \`Pin freshness\` workflow._
          EOF
          )

          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY"
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened new issue."
          fi
