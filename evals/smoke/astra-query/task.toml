# Plugin smoke test: answer questions that need conditional decisions, constraints and the output DAG.
schema_version = "1.4"
artifacts = [
  { source = "/root/line-fit/answer.json", destination = "answer.json" },
]

[task]
name = "lightcone/smoke-astra-query"
version = "0.1.0"
description = "Read an ASTRA spec with a conditional decision, an incompatibility constraint and a conditional output, and answer five questions about universes and output dependencies in answer.json."
keywords = ["astra", "smoke", "comprehension", "universes"]
[[task.authors]]
name = "cailmdaley"
email = "cailmdaley@gmail.com"

[metadata]
category = "natural-science"
difficulty = "easy"

[verifier]
timeout_sec = 180.0
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
