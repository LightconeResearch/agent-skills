# Plugin smoke test: author a minimal astra.yaml for an existing 2-step pipeline.
schema_version = "1.4"
artifacts = [
  { source = "/root/line-fit/astra.yaml", destination = "astra.yaml" },
]

[task]
name = "lightcone/smoke-astra-author"
version = "0.1.0"
description = "Write a valid astra.yaml declaring the raw input and the two outputs of an existing clean -> fit pipeline."
keywords = ["astra", "smoke", "spec-authoring"]
[[task.authors]]
name = "cailmdaley"
email = "cailmdaley@gmail.com"

[metadata]
category = "natural-science"
difficulty = "easy"

[verifier]
timeout_sec = 180.0
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
